# BeautyMarket — nginx для backend (только API/чаты/медиа; фронт живёт на Vercel).
# :80 — API + HTTP-01 challenge (certbot), :443 — HTTPS для bmmarket.duckdns.org.
#
# В контейнере (nginx:1.27-alpine, docker-compose):
#   ./certbot/www   -> /var/www/certbot   (вебрут для acme-челленджа)
#   ./certbot/conf  -> /etc/letsencrypt   (сертификаты)

upstream web {
    server web:8000;
}

server {
    listen 80;
    server_name _ bmmarket.duckdns.org;

    # Вложения (чат/поддержка) до 5 МБ + запас
    client_max_body_size 10m;

    # Выпуск/продление Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Статика Django: swagger, админка
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
    }

    # Медиа: фото товаров, аватары, вложения чата/тикетов
    location /media/ {
        alias /media/;
        expires 7d;
        access_log off;
    }

    # WebSocket: уведомления и чат
    location /ws/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Всё остальное — daphne
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: к нему подключается фронт с Vercel (api + ws)
server {
    listen 443 ssl http2;
    server_name bmmarket.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/bmmarket.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bmmarket.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}