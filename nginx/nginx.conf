upstream web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Вложения (чат/поддержка) до 5 МБ + запас
    client_max_body_size 10m;

    # Статика Django: swagger, админка
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
    }

    # Медиа: фото товаров, аватары, вложения чата/тикетов
    location /media/ {
        alias /media/;
        expires 7d;
        access_log off;
    }

    # WebSocket: уведомления и чат
    location /ws/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Всё остальное — в daphne
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
